<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RiftCoach AI</title>

<!--
  DESVIO CONSCIENTE DO PLANO (docs/05-stack-and-repo.md, 5.3).

  O plano pede Vite + React + TypeScript. Isto aqui e um arquivo so, sem build.

  O motivo e o proprio argumento do plano: ele escolheu navegador antes de
  Tauri porque "funciona desde o primeiro dia sem toolchain extra". React e
  Vite ADICIONAM uma toolchain — node no CI, dist commitado ou passo de build
  antes do `uv run riftcoach`, e mais uma coisa para um contribuidor instalar
  antes de mudar uma cor.

  Para a complexidade real desta tela — um relatorio, uma curva, uma lista
  clicavel — nada disso se paga. Se a UI crescer (comparar partidas, editar
  anotacoes, player de video do Modo C), a troca por React vira a decisao
  certa e nada aqui atrapalha: o backend ja serve JSON em /api/.
-->

<style>
  :root {
    color-scheme: dark;
    --bg: #0d1420;
    --surface: #141d2b;
    --surface-2: #1b2637;
    --line: #253449;
    --ink: #e6edf5;
    --ink-dim: #8fa3ba;
    --ink-faint: #5d7089;
    --accent: #48b0d4;
    --gold: #c8a24a;
    --sev5: #e05260;
    --sev4: #e0803f;
    --sev3: #d9b04a;
    --sev2: #6d88a8;
    --win: #45b37a;
    --loss: #e05260;
    --mono: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: 0 0 4rem;
  }

  .wrap { max-width: 980px; margin: 0 auto; padding: 0 20px; }

  /* ---- cabecalho ---- */
  header {
    border-bottom: 1px solid var(--line);
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg) 100%);
    padding: 26px 0 22px;
    margin-bottom: 28px;
  }
  .brand {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); margin-bottom: 10px;
  }
  .matchline { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .champ { font-size: 26px; font-weight: 650; letter-spacing: -.01em; }
  .vs { color: var(--ink-faint); }
  .kda { font-family: var(--mono); font-size: 17px; color: var(--ink-dim); }
  .result { font-weight: 650; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .result.win { color: var(--win); }
  .result.loss { color: var(--loss); }
  .meta {
    margin-top: 10px; font-family: var(--mono); font-size: 12.5px;
    color: var(--ink-faint); display: flex; gap: 16px; flex-wrap: wrap;
  }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 3px;
    border: 1px solid var(--line); font-size: 11px; letter-spacing: .05em;
  }
  .badge.ai { border-color: #2e5f74; color: var(--accent); }
  .badge.noai { border-color: var(--line); color: var(--ink-faint); }

  /* ---- curva ---- */
  .curve { margin-bottom: 32px; }
  .curve svg { width: 100%; height: 130px; display: block; }
  .curve-label {
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-faint);
    display: flex; justify-content: space-between; margin-top: 4px;
  }
  .marker { cursor: pointer; }
  .marker:hover circle { r: 6; }
  .umarker { cursor: pointer; }
  .umarker:hover path { stroke: #fff; stroke-width: 1.5; }
  .curve svg { cursor: crosshair; }
  .curve-legend {
    display: flex; gap: 14px; flex-wrap: wrap; margin-top: 6px;
    font-size: 11.5px; color: var(--ink-faint);
  }
  .curve-legend i { display: inline-block; width: 9px; height: 9px; margin-right: 5px;
    vertical-align: -1px; border-radius: 2px; }

  /* ---- objetivos ---- */
  .obj {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--sev2); border-radius: 4px;
    padding: 12px 16px; margin-bottom: 10px;
  }
  .obj.bom { border-left-color: var(--win); }
  .obj.ruim { border-left-color: var(--sev5); }
  .obj.incerto { border-left-color: var(--ink-faint); }
  .obj .ohead { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap;
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint); }
  .obj .oname { font-family: system-ui, "Segoe UI", sans-serif; font-size: 15px;
    font-weight: 650; color: var(--ink); }
  .obj .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; }
  .obj .who.nosso { color: var(--win); }
  .obj .who.deles { color: var(--loss); }
  .obj .duty { font-size: 11px; border: 1px solid var(--line); border-radius: 3px;
    padding: 1px 6px; }
  .obj .verdict { font-size: 14.5px; margin: 8px 0 8px; }
  .obj ul { margin: 0 0 8px; padding: 0; list-style: none; display: grid; gap: 3px; }
  .obj li { font-size: 13px; color: var(--ink-dim); }
  .obj li b { color: var(--ink-faint); font-weight: 600; margin-right: 6px; }
  .obj li.bom::before, .obj li.ruim::before, .obj li.neutro::before, .obj li.incerto::before {
    content: "●"; font-size: 9px; margin-right: 7px; vertical-align: 2px; }
  .obj li.bom::before { color: var(--win); }
  .obj li.ruim::before { color: var(--sev5); }
  .obj li.neutro::before { color: var(--ink-faint); }
  .obj li.incerto::before { color: #6b5c33; }
  .obj.fora { opacity: .72; }

  /* ---- secoes ---- */
  h2 {
    font-size: 12px; letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-faint); font-weight: 600;
    margin: 34px 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line);
  }

  /* ---- findings ---- */
  .finding {
    background: var(--surface); border: 1px solid var(--line);
    border-left: 3px solid var(--sev2);
    border-radius: 4px; padding: 16px 18px; margin-bottom: 12px;
  }
  .finding.top { background: var(--surface-2); }
  .finding[data-sev="5"] { border-left-color: var(--sev5); }
  .finding[data-sev="4"] { border-left-color: var(--sev4); }
  .finding[data-sev="3"] { border-left-color: var(--sev3); }
  .finding.user-mark { border-left-width: 5px; }
  .finding.user-mark.mark-note { border-left-color: #48b0d4; background: #132633; }
  .finding.user-mark.mark-question { border-left-color: #b084e8; background: #211a30; }
  .finding.user-mark.mark-error { border-left-color: #e05260; background: #301a21; }
  .finding.user-mark.mark-critical { border-left-color: #ff4058; background: #3a151d; }
  .finding.user-mark.mark-good { border-left-color: #45b37a; background: #142a25; }
  .finding.user-mark.mark-objective { border-left-color: #c8a24a; background: #2b2517; }
  .finding.user-mark.mark-print { border-left-color: #e0803f; background: #2d2018; }
  .mark-kind { font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
  /* mk-*, e nao o nome cru do tipo: a classe "note" colidia com o estilo
     .note da pagina e o rotulo ANOTACAO virava uma caixa. */
  .mark-kind.mk-note { color: #48b0d4; }
  .mark-kind.mk-question { color: #b084e8; }
  .mark-kind.mk-error, .mark-kind.mk-critical { color: #ff6675; }
  .mark-kind.mk-good { color: #45b37a; }
  .mark-kind.objective { color: #c8a24a; }
  .mark-kind.print { color: #e0803f; }

  .fhead {
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    font-family: var(--mono); font-size: 12px; color: var(--ink-faint);
    margin-bottom: 8px;
  }
  .rank { color: var(--ink-dim); font-weight: 650; }
  .sev { font-weight: 650; }
  .finding[data-sev="5"] .sev { color: var(--sev5); }
  .finding[data-sev="4"] .sev { color: var(--sev4); }
  .finding[data-sev="3"] .sev { color: var(--sev3); }
  .cat { color: var(--gold); letter-spacing: .06em; text-transform: uppercase; }

  .claim { font-size: 16px; line-height: 1.45; margin-bottom: 12px; }

  .ev { margin: 0 0 12px; padding: 0; list-style: none; }
  .ev li {
    font-size: 13.5px; color: var(--ink-dim); padding: 5px 0 5px 11px;
    border-left: 2px solid var(--line); margin-bottom: 2px;
  }
  /* Os tres niveis precisam ser distinguiveis SEM ler o rotulo: e a
     informacao mais importante da tela para decidir o quanto confiar. */
  .ev li.t1 { border-left-style: solid; border-left-color: #3d6b52; }
  .ev li.t2 { border-left-style: dashed; border-left-color: #6b5c33; }
  .ev li.t3 { border-left-style: dotted; border-left-color: #6b3d3d; }
  .tier {
    font-family: var(--mono); font-size: 11px; color: var(--ink-faint);
    margin-right: 7px;
  }
  .assumption {
    display: block; margin-top: 3px; font-size: 12.5px;
    color: var(--ink-faint); font-style: italic;
  }

  .fix { font-size: 14px; margin-bottom: 8px; }
  .fix b, .drill b { color: var(--ink-dim); font-weight: 600; }
  .drill { font-size: 13.5px; color: var(--ink-dim); margin-bottom: 12px; }

  button.seek {
    background: transparent; color: var(--accent);
    border: 1px solid #2e5f74; border-radius: 3px;
    padding: 6px 13px; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  button.seek:hover:not(:disabled) { background: #16303c; }
  button.seek:disabled { color: var(--ink-faint); border-color: var(--line); cursor: not-allowed; }
  .seekmsg { font-size: 12.5px; color: var(--ink-faint); margin-left: 10px; }
  .seekmsg.err { color: var(--sev4); }

  /* ---- perguntar ---- */
  button.ask {
    background: transparent; color: var(--ink-dim);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 6px 13px; font-size: 13px; font-family: inherit; cursor: pointer;
    margin-left: 8px;
  }
  button.ask:hover { color: var(--accent); border-color: #2e5f74; }
  .askbox { display: none; margin-top: 12px; }
  .askbox.open { display: block; }
  .askrow { display: flex; gap: 8px; }
  .askrow input {
    flex: 1; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 3px;
    padding: 8px 11px; font-size: 13.5px; font-family: inherit;
  }
  .voice-status { color: var(--ink-faint); font-size: 12px; margin-top: 6px; }
  .askrow input:focus { outline: none; border-color: var(--accent); }
  .askrow button {
    background: var(--accent); color: #07131b; border: 0; border-radius: 3px;
    padding: 8px 15px; font-size: 13px; font-family: inherit; font-weight: 600;
    cursor: pointer;
  }
  .askrow button:disabled { opacity: .5; cursor: default; }
  .answer {
    margin-top: 10px; padding: 12px 14px; font-size: 13.5px; line-height: 1.55;
    background: var(--surface-2); border-left: 2px solid var(--accent);
    border-radius: 0 3px 3px 0; white-space: pre-wrap;
  }
  .answer.err { border-left-color: var(--sev4); color: var(--sev4); }
  .answer .who { display: block; margin-top: 8px; font-size: 11.5px; color: var(--ink-faint); }
  .markbox { background: var(--surface); border: 1px solid var(--line); padding: 14px; border-radius: 4px; }
  .markrow { display: flex; gap: 8px; flex-wrap: wrap; }
  .markrow input, .markrow select {
    background: var(--bg); color: var(--ink); border: 1px solid var(--line);
    border-radius: 3px; padding: 8px 10px; font: inherit;
  }
  .markrow input[type="number"] { width: 130px; }
  .markrow input[type="text"] { flex: 1; min-width: 240px; }
  .markrow button { background: var(--accent); color: #07131b; border: 0; border-radius: 3px; padding: 8px 15px; font-weight: 600; cursor: pointer; }
  .markmsg { color: var(--ink-dim); font-size: 12.5px; margin-top: 8px; }
  .mark-legend { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 10px; font-size: 11px; }
  .exportbar { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
  .exportbar button { background: var(--surface); color: var(--accent); border: 1px solid #2e5f74;
    border-radius: 3px; padding: 8px 13px; font: inherit; cursor: pointer; }
  .exportbar button:hover { background: #16303c; }
  .exportmsg { color: var(--ink-faint); font-size: 12px; align-self: center; }
  @media print {
    body { background: white; color: #111; padding: 0; }
    header { background: white; border-bottom: 2px solid #222; margin-bottom: 16px; }
    .wrap { max-width: none; padding: 0; }
    .brand, .exportbar, #replaybox, button, .askbox, .seekmsg, .markbox,
    .voice-status, .mark-legend { display: none !important; }
    h2 { color: #333; border-bottom-color: #aaa; page-break-after: avoid; }
    .finding, .brow, .note { background: white !important; color: #111 !important;
      border-color: #555 !important; break-inside: avoid; }
    .claim, .fix, .drill, .ev li, .bname, .bnum, .bsrc, .fhead, .cat,
    .tier, .assumption { color: #111 !important; }
    .curve { break-inside: avoid; }
  }

  /* ---- benchmarks ---- */
  .bench { display: grid; gap: 8px; }
  .brow {
    display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px 14px;
  }
  .bname { font-size: 13.5px; }
  .bnum { font-family: var(--mono); font-size: 13px; color: var(--ink-dim); }
  .bbar { grid-column: 1 / -1; height: 3px; background: var(--line); border-radius: 2px; }
  .bfill { height: 100%; border-radius: 2px; background: var(--sev2); }
  .brow.weak .bfill { background: var(--sev4); }
  .brow.strong .bfill { background: var(--win); }
  .bsrc { font-size: 11.5px; color: var(--ink-faint); grid-column: 1 / -1; }

  .note {
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 4px; padding: 14px 16px; font-size: 13.5px; color: var(--ink-dim);
  }
  .note code { font-family: var(--mono); font-size: 12.5px; color: var(--accent); }
  .empty { color: var(--ink-faint); padding: 40px 0; text-align: center; }

  @media (max-width: 560px) {
    .champ { font-size: 21px; }
    .wrap { padding: 0 14px; }
  }
</style>

<header>
  <div class="wrap">
    <div class="brand">RiftCoach AI</div>
    <div id="head"><div class="empty">carregando…</div></div>
  </div>
</header>

<div class="wrap">
  <div class="curve" id="curve"></div>
  <div id="replaybox"></div>
  <div id="body"></div>
</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => (
  { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

let REPORT = null;

async function load() {
  const r = await fetch("/api/report");
  if (!r.ok) {
    let detalhe = "nenhuma partida analisada nesta sessão";
    try { detalhe = (await r.json()).detail || detalhe; } catch {}
    $("#head").innerHTML = `<div class="empty">Não consegui carregar este relatório.<br>
      <small>${esc(detalhe)}. Feche esta aba antiga e abra o relatório pelo RiftCoach.</small></div>`;
    return;
  }
  REPORT = await r.json();
  REPORT.user_marks = REPORT.user_marks || [];
  REPORT.screenshots = REPORT.screenshots || [];
  REPORT.objective_review = REPORT.objective_review || [];
  renderHead(); renderCurve(); renderBody(); checkReplay();
}

function renderHead() {
  const d = REPORT;
  const dur = `${Math.floor(d.duration_s / 60)}:${String(d.duration_s % 60).padStart(2, "0")}`;
  const ia = d.used_ai
    ? `<span class="badge ai">IA: ${esc(Object.keys(d.model_trace).join(", "))}</span>`
    : `<span class="badge noai">sem IA — deterministico</span>`;
  $("#head").innerHTML = `
    <div class="matchline">
      <span class="champ">${esc(d.champion)}</span>
      ${d.opponent ? `<span class="vs">vs ${esc(d.opponent)}</span>` : ""}
      <span class="kda">${esc(d.kda)}</span>
      <span class="result ${d.win ? "win" : "loss"}">${d.win ? "vitória" : "derrota"}</span>
    </div>
    <div class="meta">
      <span>${esc(d.match_id)}</span><span>patch ${esc(d.patch)}</span>
      <span>${dur}</span><span>${esc(d.role_label || d.position)}</span>${ia}
    </div>
    <div class="exportbar">
      <button onclick="salvarPDF()">Salvar relatório em PDF</button>
      <button onclick="salvarImagem()">Salvar relatório como imagem</button>
      <span class="exportmsg" id="exportmsg">O PDF inclui o relatório completo.</span>
    </div>`;
}

window.salvarPDF = function salvarPDF() {
  window.print();
};

window.salvarImagem = async function salvarImagem() {
  const status = $("#exportmsg");
  const alvo = document.querySelector("body");
  if (!alvo) return;
  status.textContent = "gerando a imagem completa…";
  const clone = alvo.cloneNode(true);
  clone.querySelectorAll(".exportbar, #replaybox, button, .askbox, .markbox").forEach(e => e.remove());
  clone.querySelectorAll("[id]").forEach(e => e.removeAttribute("id"));
  clone.style.width = `${document.documentElement.scrollWidth}px`;
  clone.style.background = "#0d1420";
  const estilos = [...document.querySelectorAll("style")].map(e => e.outerHTML).join("");
  const largura = Math.max(document.documentElement.scrollWidth, 980);
  const altura = document.documentElement.scrollHeight;
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="${largura}" height="${altura}">
    <foreignObject width="100%" height="100%">
      <div xmlns="http://www.w3.org/1999/xhtml">${estilos}${clone.outerHTML}</div>
    </foreignObject>
  </svg>`;
  const url = URL.createObjectURL(new Blob([svg], {type: "image/svg+xml"}));
  try {
    const imagem = new Image();
    await new Promise((resolve, reject) => {
      imagem.onload = resolve; imagem.onerror = reject; imagem.src = url;
    });
    const canvas = document.createElement("canvas");
    canvas.width = largura * 2; canvas.height = altura * 2;
    const contexto = canvas.getContext("2d");
    if (!contexto) throw new Error("canvas indisponível");
    contexto.scale(2, 2);
    contexto.drawImage(imagem, 0, 0);
    const link = document.createElement("a");
    link.download = `riftcoach-${REPORT.match_id}.png`;
    link.href = canvas.toDataURL("image/png");
    link.click();
    status.textContent = "imagem salva.";
  } catch {
    status.textContent = "não foi possível gerar a imagem neste navegador; use o PDF.";
  } finally {
    URL.revokeObjectURL(url);
  }
};

// A curva e a espinha da pagina: ela mostra QUANDO a partida foi decidida, e
// os marcadores ligam cada finding ao ponto da curva em que ele acontece.
function renderCurve() {
  const pts = REPORT.advantage;
  if (!pts || pts.length < 2) return;
  const W = 1000, H = 130, pad = 6;
  const x = (i) => (i / (pts.length - 1)) * W;
  const y = (wp) => pad + (1 - wp / 100) * (H - 2 * pad);

  const linha = pts.map((p, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(p.wp).toFixed(1)}`).join("");
  const area = `${linha}L${W},${H}L0,${H}Z`;
  const totalMs = REPORT.duration_s * 1000;

  const marcas = REPORT.findings.map(f => {
    const px = (f.timestamp_ms / totalMs) * W;
    const idx = Math.min(pts.length - 1, Math.round(f.timestamp_ms / 60000));
    const cor = { 5: "#e05260", 4: "#e0803f", 3: "#d9b04a" }[f.severity] || "#6d88a8";
    return `<g class="marker" onclick="jump(${f.index})">
        <title>${esc(f.at)} — ${esc(f.claim)}</title>
        <line x1="${px.toFixed(1)}" y1="0" x2="${px.toFixed(1)}" y2="${H}"
              stroke="${cor}" stroke-width="1" opacity=".3"/>
        <circle cx="${px.toFixed(1)}" cy="${y(pts[idx].wp).toFixed(1)}" r="4"
                fill="${cor}"/>
      </g>`;
  }).join("");

  // As SUAS marcacoes na mesma linha do tempo, embaixo: triangulo na cor do
  // tipo. Antes so os erros da IA apareciam aqui, e uma anotacao feita no
  // replay ou na pagina sumia no meio da lista la embaixo.
  const tri = (px, cor) =>
    `M${(px - 6).toFixed(1)},${H} L${(px + 6).toFixed(1)},${H} L${px.toFixed(1)},${H - 11} Z`;
  const suas = REPORT.user_marks.map((m, i) => {
    const px = (m.t_ms / totalMs) * W;
    const cor = COR_MARCA[m.kind] || COR_MARCA.note;
    return `<g class="umarker" onclick="event.stopPropagation(); irParaMarcacao(${i})">
        <title>${esc(m.at)} — sua ${esc(NOME_MARCA[m.kind] || "anotação")}: ${esc(m.text)}</title>
        <line x1="${px.toFixed(1)}" y1="0" x2="${px.toFixed(1)}" y2="${H}"
              stroke="${cor}" stroke-width="1" opacity=".35" stroke-dasharray="3 3"/>
        <path d="${tri(px, cor)}" fill="${cor}"/>
      </g>`;
  }).join("");
  const prints = REPORT.screenshots.map((p, i) => {
    const px = (p.t_ms / totalMs) * W;
    return `<g class="umarker" onclick="event.stopPropagation(); irParaPrint(${i})">
        <title>${esc(p.at)} — print da revisão</title>
        <rect x="${(px - 4).toFixed(1)}" y="${H - 8}" width="8" height="8" fill="#e0803f"/>
      </g>`;
  }).join("");
  const objetivos = REPORT.objective_review.map(o => {
    const px = (o.t_ms / totalMs) * W;
    const cor = o.ours ? "#45b37a" : "#e05260";
    return `<g><title>${esc(o.at)} — ${esc(o.name)} (${o.ours ? "seu time" : "inimigo"})</title>
        <rect x="${(px - 3).toFixed(1)}" y="0" width="6" height="6" rx="1" fill="${cor}"
              opacity=".85"/></g>`;
  }).join("");

  $("#curve").innerHTML = `
    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" id="curvasvg"
         aria-label="probabilidade de vitória por minuto">
      <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#48b0d4" stop-opacity=".22"/>
        <stop offset="100%" stop-color="#48b0d4" stop-opacity="0"/>
      </linearGradient></defs>
      <line x1="0" y1="${H / 2}" x2="${W}" y2="${H / 2}" stroke="#253449"
            stroke-dasharray="4 4"/>
      <path d="${area}" fill="url(#g)"/>
      <path d="${linha}" fill="none" stroke="#48b0d4" stroke-width="1.6"/>
      ${objetivos}${marcas}${prints}${suas}
    </svg>
    <div class="curve-label"><span>probabilidade de vitória · 0:00</span>
      <span>50%</span><span>${Math.floor(REPORT.duration_s / 60)}min</span></div>
    <div class="curve-legend">
      <span><i style="background:#e05260;border-radius:50%"></i>erro da IA</span>
      <span><i style="background:${COR_MARCA.note}"></i>suas marcações</span>
      <span><i style="background:#e0803f"></i>prints</span>
      <span><i style="background:#45b37a"></i>objetivo seu</span>
      <span><i style="background:#e05260"></i>objetivo inimigo</span>
      <span>· clique na curva para marcar aquele minuto</span>
    </div>`;
  // Clicar num ponto vazio da curva preenche o horario da nova marcacao.
  $("#curvasvg").addEventListener("click", (ev) => {
    const caixa = ev.currentTarget.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - caixa.left) / caixa.width));
    const campo = $("#marktime");
    if (!campo) return;
    campo.value = mmss(Math.round(frac * totalMs));
    $("#marktext").focus();
    $("#markmsg").textContent = `Marcando em ${campo.value}. Escreva e salve.`;
  });
}

const CATEGORIA = {
  wave: "wave", trading: "trocas", vision: "visão", recall: "recall", macro: "macro",
  objective: "objetivos", positioning: "posicionamento", decision: "decisão",
  tempo: "tempo", itemization: "itens", teamfight: "lutas", mechanics: "mecânica",
};
const COR_MARCA = {
  note: "#0ac8b9", question: "#b48cff", error: "#e84057",
  critical: "#ff4058", good: "#3ddc84",
};
const NOME_MARCA = {
  question: "dúvida", error: "erro", critical: "erro crítico", good: "acerto", note: "anotação",
};
const mmss = (ms) => {
  const s = Math.max(0, Math.floor(ms / 1000));
  return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
};
// Aceita "12:34", "12m34", "754" (segundos) — ninguem pensa a partida em
// segundos corridos, e o campo antigo so aceitava segundos.
const lerTempo = (txt) => {
  const t = String(txt || "").trim().replace(/[ms]/g, ":").replace(/:+$/, "");
  if (!t) return NaN;
  if (t.includes(":")) {
    const [m, s] = t.split(":").map(Number);
    return (m * 60 + (s || 0)) * 1000;
  }
  return Number(t) * 1000;
};

window.irParaMarcacao = function irParaMarcacao(i) {
  document.getElementById("um" + i)?.scrollIntoView({ behavior: "smooth", block: "center" });
};
window.irParaPrint = function irParaPrint(i) {

};

async function pularPara(tMs, alvoId) {
  const msg = document.getElementById(alvoId);
  if (msg) { msg.className = "seekmsg"; msg.textContent = "pulando…"; }
  try {
    const r = await fetch("/api/seek_at/" + Math.round(tMs), { method: "POST" });
    const d = await r.json();
    if (!msg) return;
    if (r.ok) msg.textContent = `replay em ${d.at}`;
    else { msg.className = "seekmsg err"; msg.textContent = d.error || "o client recusou"; }
  } catch {
    if (msg) { msg.className = "seekmsg err"; msg.textContent = "servidor não respondeu"; }
  }
}
window.pularPara = pularPara;

function renderBody() {
  const d = REPORT;
  const top = d.findings.slice(0, 3), resto = d.findings.slice(3);
  let html = "";
  html += `<h2>Suas marcações</h2>
    <div class="markbox">
      <div class="markrow">
        <select id="markkind">
          <option value="note">Anotação</option><option value="question">Dúvida</option>
          <option value="error">Erro meu</option><option value="good">Acerto</option>
        </select>
        <input id="marktime" type="text" inputmode="numeric" placeholder="minuto (ex.: 14:32)">
        <input id="marktext" type="text" maxlength="600" placeholder="Escreva aqui o que percebeu ou quer entender"
               onkeydown="if(event.key==='Enter')salvarMarcacao()">
        <button onclick="salvarMarcacao()">Salvar</button>
      </div>
      <div class="markmsg" id="markmsg">Dica: clique na curva acima para marcar aquele minuto. As marcações aparecem na curva, no replay (overlay) e aqui.</div>
    </div>`;
  if (d.user_marks.length) {
    html += d.user_marks.map((m, i) => `
        <article class="finding user-mark mark-${esc(m.kind)}" id="um${i}">
          <div class="fhead"><span class="cat mark-kind mk-${esc(m.kind)}">${esc(NOME_MARCA[m.kind] || "anotação")}</span>
            <span>${esc(m.at)}</span></div>
          <div class="claim">${esc(m.text)}</div>
          <button class="seek" onclick="pularPara(${m.t_ms}, 'umm${i}')">▶ Assistir no replay</button>
          <button class="ask" onclick="editarMarcacao(${i})">Editar texto</button>
          <button class="ask" onclick="apagarMarcacao(${i})">Apagar</button>
          <span class="seekmsg" id="umm${i}"></span>
        </article>`).join("");
  }
  if (!d.findings.length) {
    html += `<div class="note">Nenhum erro acima do limiar nesta partida. Isso não quer
      dizer que ela foi perfeita — quer dizer que a telemetria sozinha não enxergou
      nada grave.</div>`;
  } else {
    html += `<h2>Os ${top.length} principais</h2>` + top.map(f => card(f, true)).join("");
    if (resto.length) html += `<h2>Também vale olhar</h2>` + resto.map(f => card(f, false)).join("");
  }
  if (d.benchmarks.length) {
    html += `<h2>Benchmarks</h2><div class="bench">` + d.benchmarks.map(b => `
      <div class="brow ${b.weak ? "weak" : b.strong ? "strong" : ""}">
        <span class="bname">${esc(b.label.split(" (")[0])}</span>
        <span class="bnum">p${b.percentile.toFixed(0)} · mediana ${b.median}</span>
        <div class="bbar"><div class="bfill" style="width:${b.percentile}%"></div></div>
        <span class="bsrc">${esc(b.source_label)}</span>
      </div>`).join("") + `</div>`;
  }
  if (d.build) html += renderBuild(d.build);
  if (d.objective_review.length) {
    const papel ={ principal: "objetivo seu", secundario: "você ajuda", fora: "não é do seu papel" };
    html += `<h2>Objetivos, pelo seu papel (${esc(d.role_label || d.position)})</h2>` +
      d.objective_review.map((o, i) => `
        <article class="obj ${esc(o.tone)} ${o.role_duty === "fora" ? "fora" : ""}">
          <div class="ohead">
            <span>${esc(o.at)}</span><span class="oname">${esc(o.name)}</span>
            <span class="who ${o.ours ? "nosso" : "deles"}">${o.ours ? "seu time" : "inimigo"}</span>
            <span class="duty">${esc(papel[o.role_duty] || o.role_duty)}</span>
          </div>
          <div class="verdict">${esc(o.verdict)}</div>
          <ul>${o.items.map(it => `<li class="${esc(it.tone)}"><b>${esc(it.label)}</b>${esc(it.text)}</li>`).join("")}</ul>
          <button class="seek" onclick="pularPara(${Math.max(0, o.t_ms - 20000)}, 'om${i}')">▶ Ver a disputa no replay</button>
          <span class="seekmsg" id="om${i}"></span>
        </article>`).join("");
  }

  window.salvarMarcacao = async function salvarMarcacao() {
    const tipo = $("#markkind").value;
    const tMs = lerTempo($("#marktime").value);
    const texto = $("#marktext").value.trim();
    const msg = $("#markmsg");
    if (!Number.isFinite(tMs) || tMs < 0 || !texto) {
      msg.textContent = "Informe o minuto (ex.: 14:32) e escreva a anotação.";
      return;
    }
    if (tMs > d.duration_s * 1000) {
      msg.textContent = `A partida acabou em ${mmss(d.duration_s * 1000)}.`;
      return;
    }
    msg.textContent = "salvando…";
    const r = await fetch("/api/marks", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t_ms: Math.round(tMs), kind: tipo, text: texto }),
    });
    const data = await r.json();
    if (!r.ok) { msg.textContent = data.detail || "não foi possível salvar"; return; }
    REPORT.user_marks.push(data.mark);
    REPORT.user_marks.sort((a, b) => a.t_ms - b.t_ms);
    $("#marktext").value = "";
    renderCurve();
    renderBody();
    $("#markmsg").textContent = `${NOME_MARCA[tipo] || "Anotação"} salva em ${data.mark.at} — já aparece na curva e no overlay.`;
  };
  window.apagarFinding = async function apagarFinding(index, text, tMs) {
    if (!window.confirm("Apagar esta marcação do overlay e do relatório?")) return;
    const r = await fetch("/api/marks", {
      method: "DELETE", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({t_ms: tMs, text, author: "ai"}),
    });
    if (!r.ok) {
      const erro = await r.json().catch(() => ({}));
      $("#markmsg").textContent = erro.detail || "não foi possível apagar a marcação";
      return;
    }
    await load();
  };
  window.editarMarcacao = async function editarMarcacao(index) {
    const mark = REPORT.user_marks[index];
    if (!mark) return;
    const texto = window.prompt("Texto da marcação:", mark.text);
    if (texto === null || !texto.trim() || texto.trim() === mark.text) return;
    const r = await fetch("/api/marks", {
      method: "PUT", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        t_ms: mark.t_ms, kind: mark.kind, text: texto.trim(), old_text: mark.text
      }),
    });
    if (!r.ok) {
      $("#markmsg").textContent = "não foi possível atualizar a marcação";
      return;
    }
    mark.text = texto.trim();
    renderCurve();
    renderBody();
  };
  window.apagarMarcacao = async function apagarMarcacao(index) {
    const mark = REPORT.user_marks[index];
    if (!mark || !window.confirm("Apagar esta marcação?")) return;
    const r = await fetch("/api/marks", {
      method: "DELETE", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ t_ms: mark.t_ms, text: mark.text }),
    });
    if (!r.ok) return;
    REPORT.user_marks.splice(index, 1);
    renderCurve();
    renderBody();
  };
  if (d.screenshots.length) {
    html += `<h2>Prints da revisão</h2><div class="user-marks">` +
      d.screenshots.map((p, i) => `
        <article class="finding user-mark mark-print" id="pr${i}">
          <div class="fhead"><span class="cat mark-kind print">print</span><span>${esc(p.at)}</span></div>
          <img src="${esc(p.path)}" alt="Print do replay em ${esc(p.at)}" style="max-width:100%">
          <button class="ask" onclick="apagarPrint(${i})">Apagar print</button>
        </article>`).join("") + `</div>`;
  }
  window.apagarPrint = async function apagarPrint(index) {
    const print = REPORT.screenshots[index];
    if (!print || !window.confirm("Apagar este print?")) return;
    const r = await fetch(print.path, { method: "DELETE" });
    if (!r.ok) return;
    REPORT.screenshots.splice(index, 1);
    renderCurve();
    renderBody();
  };
  html += `<h2>Procedência</h2><div class="note">` + (d.used_ai
    ? `Modelos: <code>${esc(Object.keys(d.model_trace).join(", "))}</code>.
       ${d.validation ? esc(d.validation) + "." : ""}`
    : `Este relatório foi calculado inteiramente em Python, nesta máquina.
       Nenhum modelo foi consultado e nenhum dado saiu daqui.`)
    + ` Patch ${esc(d.patch)}.</div>`;
  $("#body").innerHTML = html;
}

// Build, runas e matchup: o que VOCE fez ao lado do que os melhores do
// servidor fazem com o mesmo campeao — sempre com a amostra a vista.
function renderBuild(b) {
  const amostra = (o) => o.games
    ? `${o.wr}% vitória <small>(±${o.wr_margin}, ${o.games} partida${o.games === 1 ? "" : "s"})</small>`
    : "sem partidas";
  const linha = (o) => `
    <div class="brow ${o.yours ? "strong" : ""}">
      <span class="bname">${o.yours ? "✔ " : ""}${esc(o.name)}</span>
      <span class="bnum">usado em ${o.pick}% · ${amostra(o)}</span>
      <div class="bbar"><div class="bfill" style="width:${o.pick}%"></div></div>
    </div>`;
  const semAmostra = !b.champion_games;
  let h = `<h2>Build, runas e matchup · ${esc(b.champion)}</h2>`;
  h += `<div class="note">Comparado com <b>${esc(b.source)}</b>, patch ${esc(b.patches.join(" + "))}:
    ${esc(b.champion)} neste papel tem ${esc(b.champion_wr)}.
    ${semAmostra ? "Ainda não há partidas deste campeão na amostra — rode <code>riftcoach meta</code> para coletar." : ""}
    ${b.champion_games && b.champion_games < 30 ? " Amostra pequena: trate como tendência." : ""}</div>`;
  if (b.opponent) {
    h += `<div class="brow" style="margin-top:8px"><span class="bname">Matchup contra <b>${esc(b.opponent)}</b></span>
      <span class="bnum">${b.matchup_games ? esc(b.matchup) : "sem partidas na amostra"}
      ${b.matchup_lane !== null && b.matchup_games >= 5 ? ` · venceu a rota em ${b.matchup_lane}%` : ""}</span></div>`;
  }
  h += `<h2>Runas — as suas: ${esc(b.runes_yours || "?")}</h2><div class="bench">`
    + (b.runes_meta.length ? b.runes_meta.map(linha).join("") : `<div class="note">sem amostra</div>`)
    + `</div>`;
  h += `<h2>Itens — os seus: ${esc(b.items_yours.join(", ") || "?")}</h2><div class="bench">`
    + (b.items_meta.length ? b.items_meta.map(linha).join("") : `<div class="note">sem amostra</div>`)
    + `</div>`;
  if (b.composition.length || b.notes.length) {
    h += `<h2>Composição inimiga</h2><div class="note">`
      + b.composition.map(c => `<div>${esc(c)}</div>`).join("")
      + b.notes.map(n => `<div style="margin-top:6px;color:var(--ink)"><b>→</b> ${esc(n)}</div>`).join("")
      + `</div>`;
  }
  return h;
}

function card(f, isTop) {
  const ev = f.evidence.map(e => `
    <li class="${e.tier.toLowerCase()}">
      <span class="tier">[${e.tier}]</span>${esc(e.statement)}
      ${e.assumption ? `<span class="assumption">premissa: ${esc(e.assumption)}</span>` : ""}
    </li>`).join("");
  return `
    <article class="finding ${isTop ? "top" : ""}" data-sev="${f.severity}" id="f${f.index}">
      <div class="fhead">
        <span class="rank">#${f.index + 1}</span>
        <span class="sev">gravidade ${f.severity}</span>
        <span>${esc(f.at)}</span>
        <span class="cat">${esc(CATEGORIA[f.category] || f.category)}</span>
      </div>
      <div class="claim">${esc(f.claim)}</div>
      <ul class="ev">${ev}</ul>
      <div class="fix"><b>Correção:</b> ${esc(f.fix)}</div>
      ${f.drill ? `<div class="drill"><b>Treino:</b> ${esc(f.drill)}</div>` : ""}
      <button class="seek" onclick="jump(${f.index})" id="b${f.index}">
        ▶ Assistir no replay · ${esc(f.seek_at)}
      </button>
      <button class="ask" onclick="abrirPergunta(${f.index})" id="a${f.index}">
        Perguntar sobre este momento
      </button>
      <button class="ask" onclick="apagarFinding(${f.index}, ${JSON.stringify(f.claim)}, ${f.timestamp_ms})">
        Apagar marcação
      </button>
      <span class="seekmsg" id="m${f.index}"></span>
      <div class="askbox" id="q${f.index}">
        <div class="askrow">
          <input type="text" id="i${f.index}" maxlength="600"
                 placeholder="ex.: o que eu deveria ter feito aqui?"
                 onkeydown="if(event.key==='Enter')perguntar(${f.index})">
          <button onclick="falarPergunta(${f.index})" id="v${f.index}">🎙 Falar</button>
          <button onclick="perguntar(${f.index})" id="s${f.index}">Perguntar</button>
        </div>
        <div class="voice-status" id="vs${f.index}">Você também pode falar a dúvida no microfone.</div>
        <div id="r${f.index}"></div>
      </div>
    </article>`;
}

async function checkReplay() {
  const r = await fetch("/api/replay/status");
  const s = await r.json();
  const box = $("#replaybox");
  if (s.available) {
    box.innerHTML = `<div class="note">Replay rodando — clique em qualquer finding
      para pular. O replay para <b>8 segundos antes</b> do momento marcado: o erro é a
      decisão, não a consequência.</div>`;
    return;
  }
  document.querySelectorAll("button.seek").forEach(b => { b.disabled = true; });
  box.innerHTML = `<div class="note">Sem replay: ${esc(s.reason || "client não encontrado")}.
    ${s.hint ? esc(s.hint) : "O relatório inteiro funciona sem ele."}</div>`;
}

async function jump(i) {
  const msg = document.getElementById("m" + i);
  document.getElementById("f" + i)?.scrollIntoView({ behavior: "smooth", block: "center" });
  if (!msg) return;
  msg.className = "seekmsg"; msg.textContent = "pulando…";
  try {
    const r = await fetch("/api/seek/" + i, { method: "POST" });
    const d = await r.json();
    if (r.ok) { msg.textContent = `replay em ${d.at}`; }
    else { msg.className = "seekmsg err"; msg.textContent = d.error || "o client recusou"; }
  } catch {
    msg.className = "seekmsg err"; msg.textContent = "servidor não respondeu";
  }
}

function abrirPergunta(i) {
  const box = document.getElementById("q" + i);
  box.classList.toggle("open");
  if (box.classList.contains("open")) document.getElementById("i" + i).focus();
}

async function perguntar(i) {
  const campo = document.getElementById("i" + i);
  const botao = document.getElementById("s" + i);
  const alvo = document.getElementById("r" + i);
  const pergunta = campo.value.trim();
  if (!pergunta) return;

  botao.disabled = true;
  // O aviso de espera e literal, e nao decorativo: o tier gratuito do Groq
  // limita por tokens por minuto, e uma pergunta leva alguns segundos.
  alvo.innerHTML = `<div class="answer">pensando…</div>`;
  try {
    const r = await fetch("/api/perguntar", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ pergunta, finding: i }),
    });
    const d = await r.json();
    if (r.ok) {
      alvo.innerHTML = `<div class="answer">${esc(d.resposta)}
        <span class="who">${esc(d.provedor)}</span></div>`;
      campo.value = "";
    } else {
      const motivo = d.error || d.detail || "não consegui responder";
      const dica = d.hint ? ` ${d.hint}` : "";
      alvo.innerHTML = `<div class="answer err">${esc(motivo)}${esc(dica)}</div>`;
    }

  } catch {
    alvo.innerHTML = `<div class="answer err">o servidor não respondeu</div>`;
  } finally {
    botao.disabled = false;
  }
}

// Fora de perguntar(): antes ela so era definida DEPOIS da primeira
// pergunta enviada, e o botao de microfone nao fazia nada ate la.
window.falarPergunta = function falarPergunta(i) {
    const campo = document.getElementById("i" + i);
    const status = document.getElementById("vs" + i);
    const botao = document.getElementById("v" + i);
    const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!Recognition) {
      status.textContent = "Este navegador não oferece reconhecimento de voz. Digite a dúvida.";
      return;
    }
    const reconhecimento = new Recognition();
    reconhecimento.lang = "pt-BR";
    reconhecimento.interimResults = false;
    reconhecimento.continuous = false;
    botao.disabled = true;
    status.textContent = "Fale sua dúvida no microfone…";
    reconhecimento.onresult = (evento) => {
      const texto = evento.results[0][0].transcript;
      campo.value = (campo.value ? campo.value + " " : "") + texto;
      status.textContent = `Entendi: “${texto}”`;
    };
    reconhecimento.onerror = (evento) => {
      const mensagens = {
        "not-allowed": "O microfone foi bloqueado. Permita o acesso no navegador.",
        "audio-capture": "Não encontrei um microfone disponível.",
        "no-speech": "Não entendi nenhuma fala. Tente novamente ou digite.",
      };
      status.textContent = mensagens[evento.error] || "Não consegui ouvir. Digite a dúvida.";
    };
    reconhecimento.onend = () => { botao.disabled = false; };
    try {
      reconhecimento.start();
    } catch {
      botao.disabled = false;
      status.textContent = "Não consegui iniciar o microfone. Digite a dúvida.";
    }
  };

load();
// Marcacoes feitas no overlay sao gravadas por outro processo. A pagina so
// pergunta a VERSAO do arquivo (barato) e recarrega quando ela muda — antes
// recarregava tudo a cada 2 s, fechando caixas abertas no meio da leitura.
let versaoDaRevisao = null;
setInterval(async () => {
  try {
    const r = await fetch("/api/review/version");
    const { version } = await r.json();
    if (versaoDaRevisao !== null && version !== versaoDaRevisao) {
      const digitando = document.activeElement && ["INPUT", "SELECT", "TEXTAREA"]
        .includes(document.activeElement.tagName);
      const perguntando = document.querySelector(".askbox.open");
      if (!digitando && !perguntando) { versaoDaRevisao = version; load(); return; }
      return;  // tenta de novo no proximo ciclo, sem perder a mudanca
    }
    versaoDaRevisao = version;
  } catch {}
}, 2000);
</script>
