[project]
name = "riftcoach"
version = "0.1.0"
description = "Coach de League of Legends open source, gratuito e compativel com as regras da Riot"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-or-later" }

dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "zstandard>=0.22",
    "aiosqlite>=0.20",
    "typer>=0.12",
    "rich>=13.7",
    "keyring>=25.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Instaladas so quando a etapa correspondente entrar (ver docs/05-stack-and-repo.md 5.8)
knowledge = ["fastembed>=0.3", "sqlite-vec>=0.1.6", "pyarrow>=16.0"]
# pyyaml so e preciso para SOBRESCREVER os provedores; os padroes vivem em
# llm/catalog.py e funcionam sem ele.
llm = ["pyyaml>=6.0"]
vision = ["av>=12.0", "rapidocr-onnxruntime>=1.3", "pillow>=10.3", "numpy>=1.26"]
# A interface web. Fica em extra e nao nas dependencias base porque a CLI
# precisa continuar funcionando numa maquina onde ninguem vai abrir navegador.
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]

[project.scripts]
riftcoach = "riftcoach.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "syrupy>=4.6",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["riftcoach"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
# O parser e o contrato de dados sao onde moram os bugs silenciosos de correcao.
# analysis/ e benchmarks.py entraram junto com a etapa 2: eles produzem o
# relatorio que o usuario le e age em cima, entao um bug silencioso ali custa
# tanto quanto um no parser.
files = [
    "riftcoach/core",
    "riftcoach/parse",
    "riftcoach/riot",
    "riftcoach/analysis",
    "riftcoach/knowledge/benchmarks.py",
    "riftcoach/knowledge/validator.py",
    "riftcoach/llm",
    # replay/ e o intertravamento de conformidade: e o codigo do projeto onde
    # um bug silencioso tem a pior consequencia possivel para o usuario.
    "riftcoach/replay",
]

[[tool.mypy.overrides]]
module = ["zstandard.*", "aiosqlite.*", "keyring.*", "pyarrow.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
